[package]
name = "snap"
version = "0.1.0"
edition = "2024"
description = "Minimal, powerful screenshots of live websites"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
url = "2"

[profile.release]
strip = true
lto = true
