<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iris session fixture</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f3ee;
        font: 400 14px/1.5 system-ui, sans-serif;
      }

      #always,
      #returning {
        box-sizing: border-box;
        width: 200px;
        min-height: 40px;
        margin: 16px;
        padding: 8px;
        border: 4px solid #10231b;
        background: #2bc477;
      }
    </style>
  </head>
  <body>
    <div id="always">first visit</div>
    <div id="host"></div>
    <script>
      // First load in a profile stores a flag; later loads in the SAME
      // profile render #returning. A fresh profile never sees it.
      if (window.localStorage.getItem("iris_seen")) {
        const back = document.createElement("div");
        back.id = "returning";
        back.textContent = "welcome back";
        document.getElementById("host").appendChild(back);
      } else {
        window.localStorage.setItem("iris_seen", "1");
      }
    </script>
  </body>
</html>
